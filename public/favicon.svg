<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="45" stroke="url(#gold_grad)" stroke-width="3" />

  <g stroke="url(#gold_grad)" stroke-width="2.5" stroke-linecap="round">
    <path d="M50 5 L50 35 M50 35 L76 20" />
    <path d="M95 50 L65 50 M65 50 L80 76" />
    <path d="M50 95 L50 65 M50 65 L24 80" />
    <path d="M5 50 L35 50 M35 50 L20 24" />
    <path d="M81.8 18.2 L60 40" />
    <path d="M81.8 81.8 L60 60" />
    <path d="M18.2 81.8 L40 60" />
    <path d="M18.2 18.2 L40 40" />
  </g>

  <circle cx="50" cy="50" r="6" fill="url(#gold_grad)" filter="url(#glow)" />

  <path d="M50 50 L85 15" stroke="url(#gold_grad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.8" />

  <circle cx="85" cy="15" r="5" fill="white" filter="url(#glow)" />
</svg>
